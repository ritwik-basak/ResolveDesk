<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#g)"/>
  <!-- Antenna stem -->
  <line x1="16" y1="9" x2="16" y2="6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Antenna dot -->
  <circle cx="16" cy="5" r="1.8" fill="white"/>
  <!-- Head rectangle -->
  <rect x="7" y="9" width="18" height="14" rx="3" fill="none" stroke="white" stroke-width="1.6"/>
  <!-- Left eye -->
  <circle cx="12" cy="15.5" r="1.8" fill="white"/>
  <!-- Right eye -->
  <circle cx="20" cy="15.5" r="1.8" fill="white"/>
  <!-- Mouth -->
  <rect x="11" y="19.5" width="10" height="1.5" rx="0.75" fill="white"/>
</svg>
